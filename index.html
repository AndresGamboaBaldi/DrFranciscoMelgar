    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity .4s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-ring {
        width: 48px;
        height: 48px;
        border: 2px solid rgba(196,153,90,.2);
        border-top-color: #c4995a;
        border-radius: 50%;
        animation: spin .9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash"><div class="splash-ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
